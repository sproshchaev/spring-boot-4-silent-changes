name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Recipe, build and contract match expected.txt
        run: ./run.sh
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs
          path: ${{ runner.temp }}/tmp.*/**/*.log
